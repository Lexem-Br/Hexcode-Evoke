plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gradleup.shadow' version '9.4.2'
    id 'com.azuredoom.hytale-tools' version '1.0.50'
}

repositories {
    mavenCentral()
    maven { url "https://www.cursemaven.com" }
}

configurations {
    shadowBundle
    implementation.extendsFrom(shadowBundle)
    testImplementation.extendsFrom(compileOnly)
}

dependencies {
//    vineImplementation files('lib/Hexcode-0.11.0.jar')
    vineImplementation('curse.maven:hexcode-1448311:9252588')
    shadowBundle('com.riprod:patchly:3.+')

    testImplementation platform('org.junit:junit-bom:5.10.5')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

hytaleTools {
    javaVersion = project.java_version as Integer
    hytaleVersion = project.hytale_version.toString()
    manifestServerVersion = project.manifestServerVersion.toString()
    manifestGroup = project.manifest_group.toString()
    modId = project.mod_id.toString()
    modDescription = project.mod_description.toString()
    mainClass = project.main_class.toString()
    modCredits = project.mod_credits.toString()
    disabledByDefault = project.disabled_by_default.toString().toBoolean()
    includesPack = project.includes_pack.toString().toBoolean()
    patchline = project.patchline.toString()

    manifestOptionalDependencies='Riprod:Hexcode=^0.11.0,Riprod:Patchly=*,Hytale:Memories=*'

    debugEnabled = true
    debugSuspend = false
    requireDcevm = true
    injectServerJavadocsIntoSources = true
}

tasks.shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
    configurations = [project.configurations.shadowBundle]
    relocate("com.riprod.patchly", "com.lexem.hexcodeevoke.shaded.patchly")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from("src/main/resources")
}

def asciiPath = { File file -> file.absolutePath ==~ /\p{ASCII}*/ }
def testRunDir = new File(gradle.gradleUserHomeDir, "test-runs/${project.name}")

def syncTestClasses = tasks.register('syncTestClasses', Sync) {
    from(sourceSets.main.output.classesDirs) { into 'main' }
    from(sourceSets.test.output.classesDirs) { into 'test' }
    into testRunDir
}

tasks.test {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'com.hypixel.hytale.logger.backend.HytaleLogManager'

    if (!asciiPath(projectDir)) {
        dependsOn syncTestClasses
        testClassesDirs = files("$testRunDir/test")
        classpath = files("$testRunDir/test", "$testRunDir/main") + sourceSets.test.runtimeClasspath.filter { asciiPath(it) }
    }
}

tasks.build {
    dependsOn("shadowJar")
}